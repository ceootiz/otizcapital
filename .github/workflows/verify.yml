name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: otiz
          POSTGRES_PASSWORD: otiz_test_password
          POSTGRES_DB: otiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otiz -d otiz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://otiz:otiz_test_password@127.0.0.1:5432/otiz_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PostgreSQL baseline
        run: pnpm db:baseline:test

      - name: Prove PostgreSQL money concurrency and rollback
        run: pnpm test:postgres

      - name: Verify
        run: pnpm verify
